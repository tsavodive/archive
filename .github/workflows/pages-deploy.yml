name: "Build and Deploy"

on:
  push:
    branches:
      - main
    paths-ignore:
      - .gitignore
      - README.md
      - LICENSE
      - POSTING_GUIDE.md
      - WORKLOG.md
      - chirpy_archive_project_handoff.md

  # Actions 탭에서 수동으로도 실행할 수 있습니다.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 동시에 1건만 배포
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # 게시글 최종 수정일(lastmod) 계산에 필요

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      # Chirpy 테마 소스를 그대로 쓰기 때문에 JS/CSS를 먼저 빌드해야 합니다.
      # (assets/js/dist, _sass/vendors 는 .gitignore 대상이라 저장소에 없습니다)
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Build assets (JS/CSS)
        run: |
          npm ci
          npm run build

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Build site
        run: bundle exec jekyll b -d "_site${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: "production"

      # 링크 점검. 문제가 있어도 배포는 계속 진행하고 로그에만 남깁니다.
      - name: Test site
        continue-on-error: true
        run: |
          bundle exec htmlproofer _site \
            --disable-external \
            --allow-missing-href \
            --ignore-urls "/^http:\/\/127.0.0.1/,/^http:\/\/0.0.0.0/,/^http:\/\/localhost/"

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "_site${{ steps.pages.outputs.base_path }}"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
